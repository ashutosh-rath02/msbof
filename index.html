  {t:'Would I Rather Be Feared or Loved?',pages:[
   [['p',`Webster's Dictionary defines leadership as: when a person leads a group of other persons, like a goose. I have since looked it up and it said something else. I stand by Webster's first draft.`],['p',`Which brings us to the question that has haunted every great leader in history. Is it better to be feared, or loved? Machiavelli said feared. With respect, Machiavelli never ran a Fun Run.`],['p',`The correct answer is both. I want people to be afraid of how much they love me. And if you cannot be both, be both.`]],
   [['p',`I learned this on a Tuesday. A new hire shook my hand and said, "Mr. Scott, I have heard a lot about you." I said, "All of it true." He said, "Some of it was concerning."`],['p',`Now I had his full attention. A boss with attention is a boss with power. And power, used correctly, is just friendship with a lanyard.`],['p',`As they say, a boss in the hand is worth two in the bush. Nobody has ever said that. I said it just now, and it landed.`],['m',`Michael's Maxim`,`A good boss is like a good pizza. Everyone is happy when he shows up, and if he is late, people are upset.`],['note',`Learn his name. Check lanyard.`]],
   [['h2',`The day I fired nobody`],['p',`One morning I decided to fire somebody, because I read that real bosses do that. I called everyone into the conference room and said, "Someone in this room is about to be let go." Nobody breathed. It was the most powerful moment of my career.`],['p',`Then I said, "Just kidding. I love you all," and they clapped. Toby asked if that was allowed. I said, "Toby, I have declared it allowed." That is how declaring works.`],['w',`Do not try this at home. If you are not me, you will be sued. If you are me, you will also be sued, but with style.`]],
   [['h2',`The part where I stop doing a bit`],['p',`When I say family, I am not joking. I have a lot of ideas about how to get people to like me. Some are bad. I know that.`],['p',`Pam had an art show once, and not many people came. I went. I bought a painting of our building, and I hung it where everyone could see it. Nobody asked me to.`],['p',`I ask for love too much. I know that. I am working on it. Anyway. Do not tell Toby I said so.`],['note',`Hug count this week: 4`]],
   [['h2',`What to take away`],['p',`First, be loved. It is better than being feared, and cheaper than being rich.`],['p',`Second, be feared a little. About the amount you feel when a fire drill might not be a drill.`],['p',`Third, never, under any circumstances, for any reason, at any time, to anyone, say "I'm not a boss, I'm a friend" in front of Corporate. They take notes.`],['m',`Review questions`,`1. Feared or loved? 2. Greatest boss in history? 3. What is on the mug? Answers: Both. Me. World's Best Boss.`]]]},
